<!DOCTYPE html>
<html>
<head>
<title>CSS Transform Gallery</title>
<link rel="stylesheet" href="../style/css_gallert.css">
</head>

<body>

<h1>CSS Transform Gallery</h1>

<div class="gallery">

<!-- Rotation -->
<div class="box rotate">
<p>Rotate</p>
</div>

<!-- Scale -->
<div class="box scale">
<p>Scale</p>
</div>

<!-- Translate -->
<div class="box translate">
<p>Translate</p>
</div>

<!-- 3D Transform -->
<div class="box rotate3d">
<p>3D Rotate</p>
</div>

<!-- Transform Origin -->
<div class="box origin">
<p>Origin</p>
</div>

<!-- Combined Transform -->
<div class="box combined">
<p>Combined</p>
</div>

</div>

</body>
</html>
