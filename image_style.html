<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Styling Portfolio</title>
<link rel="stylesheet" href="../style/image_Style.css">
</head>

<body>

<h1>Image Styling Portfolio</h1>

<div class="gallery">

    <!-- Rounded Corners -->
    <div class="card">
        <h3>Rounded Corners</h3>
        <img src="https://picsum.photos/300/200?1" class="rounded">
    </div>

    <!-- Circular Image -->
    <div class="card">
        <h3>Circular Image</h3>
        <img src="https://picsum.photos/200?2" class="circle">
    </div>

    <!-- Border and Shadow -->
    <div class="card">
        <h3>Border & Shadow</h3>
        <img src="https://picsum.photos/300/200?3" class="border-shadow">
    </div>

    <!-- Hover Effect -->
    <div class="card">
        <h3>Hover Effect</h3>
        <img src="https://picsum.photos/300/200?4" class="hover-effect">
    </div>

    <!-- CSS Filters -->
    <div class="card">
        <h3>CSS Filter</h3>
        <img src="https://picsum.photos/300/200?5" class="filter">
    </div>

    <!-- Image Overlay -->
    <div class="card overlay-card">
        <img src="https://picsum.photos/300/200?6">
        <div class="overlay">
            <p>Beautiful View</p>
        </div>
    </div>

</div>

</body>
</html>
