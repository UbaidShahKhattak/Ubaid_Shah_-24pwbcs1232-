<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Data Table</title>
    <link rel="stylesheet" href="../style/responsive-data-table.css">
</head>
<body>
    <div class="table-container">
        <h1>Employee Data</h1>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Department</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>John Doe</td>
                    <td>Manager</td>
                    <td>Sales</td>
                    <td>john@example.com</td>
                    <td>123-456-7890</td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>Developer</td>
                    <td>IT</td>
                    <td>jane@example.com</td>
                    <td>234-567-8901</td>
                </tr>
                <tr>
                    <td>Mike Johnson</td>
                    <td>Designer</td>
                    <td>Marketing</td>
                    <td>mike@example.com</td>
                    <td>345-678-9012</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
