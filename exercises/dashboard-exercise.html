<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<link rel="stylesheet" href="../style/dashboard.css">
</head>
<body>

<!-- Dashboard Container -->
<div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li>Dashboard</li>
            <li>Users</li>
            <li>Settings</li>
            <li>Reports</li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <h1>Dashboard</h1>
        </header>

        <!-- Stat Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>Users</h3>
                <p>1200</p>
            </div>
            <div class="stat-card">
                <h3>Sales</h3>
                <p>$15,000</p>
            </div>
            <div class="stat-card">
                <h3>Orders</h3>
                <p>320</p>
            </div>
            <div class="stat-card">
                <h3>Feedback</h3>
                <p>85</p>
            </div>
        </div>

        <!-- Content Area -->
        <section class="content-area">
            <p>This is the main content area of the admin dashboard.</p>
        </section>
    </main>

</div>

</body>
</html>
