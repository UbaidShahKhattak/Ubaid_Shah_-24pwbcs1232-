<!DOCTYPE html>
<html>
<head>
<title>E-commerce Product Grid</title>
<link rel="stylesheet" href="../style/ecomerce-grid.css">
</head>
<body>

<h1 style="text-align:center;">E-commerce Product Grid</h1>

<div class="ecom-container">

    <!-- Sidebar Filter -->
    <aside class="filter-sidebar" id="sidebar">
        <h3>Filters</h3>
        <ul>
            <li>Category</li>
            <li>Price</li>
            <li>Brand</li>
        </ul>
    </aside>

    <!-- Main Product Grid -->
    <main class="product-grid">
        <div class="product-card">
            <img src="https://picsum.photos/200?random=1" alt="Product 1">
            <h4>Product 1</h4>
            <p>$50</p>
        </div>
        <div class="product-card">
            <img src="https://picsum.photos/200?random=2" alt="Product 2">
            <h4>Product 2</h4>
            <p>$70</p>
        </div>
        <div class="product-card">
            <img src="https://picsum.photos/200?random=3" alt="Product 3">
            <h4>Product 3</h4>
            <p>$90</p>
        </div>
        <div class="product-card">
            <img src="https://picsum.photos/200?random=4" alt="Product 4">
            <h4>Product 4</h4>
            <p>$120</p>
        </div>
        <div class="product-card">
            <img src="https://picsum.photos/200?random=5" alt="Product 5">
            <h4>Product 5</h4>
            <p>$60</p>
        </div>
        <div class="product-card">
            <img src="https://picsum.photos/200?random=6" alt="Product 6">
            <h4>Product 6</h4>
            <p>$80</p>
        </div>
    </main>

</div>

</body>
</html>
