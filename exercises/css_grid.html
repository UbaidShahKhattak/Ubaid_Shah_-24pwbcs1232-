<!DOCTYPE html>
<html>
<head>
<title>CSS Grid Photo Gallery</title>
<link rel="stylesheet" href="../style/css_grid.css">
</head>
<body>

<h1 style="text-align:center;">CSS Grid Photo Gallery</h1>

<div class="gallery">

    <div class="photo photo1">
        <img src="https://picsum.photos/300/200?random=1" alt="Photo 1">
        <div class="overlay">Photo 1</div>
    </div>

    <div class="photo photo2">
        <img src="https://picsum.photos/300/300?random=2" alt="Photo 2">
        <div class="overlay">Photo 2</div>
    </div>

    <div class="photo photo3">
        <img src="https://picsum.photos/300/250?random=3" alt="Photo 3">
        <div class="overlay">Photo 3</div>
    </div>

    <div class="photo photo4">
        <img src="https://picsum.photos/300/200?random=4" alt="Photo 4">
        <div class="overlay">Photo 4</div>
    </div>

    <div class="photo photo5">
        <img src="https://picsum.photos/300/350?random=5" alt="Photo 5">
        <div class="overlay">Photo 5</div>
    </div>

    <div class="photo photo6">
        <img src="https://picsum.photos/300/250?random=6" alt="Photo 6">
        <div class="overlay">Photo 6</div>
    </div>

</div>

</body>
</html>
