<!DOCTYPE html>
<html>
<head>
<title>Flexbox Card Layout</title>
<link rel="stylesheet" href="../style/flexbox_card.css">
</head>

<body>

<h1 style="text-align:center;">Flexbox Card Layout</h1>

<div class="card-container">

    <div class="card">
        <h3>Card 1</h3>
        <p>This is a short description.</p>
        <button>Read More</button>
    </div>

    <div class="card">
        <h3>Card 2</h3>
        <p>This card has a longer description to test equal height behavior across cards.</p>
        <button>Read More</button>
    </div>

    <div class="card">
        <h3>Card 3</h3>
        <p>Another card with medium-length content.</p>
        <button>Read More</button>
    </div>

    <div class="card">
        <h3>Card 4</h3>
        <p>Extra content to see how flexbox manages equal heights.</p>
        <button>Read More</button>
    </div>

</div>

</body>
</html>
