<!DOCTYPE html>
<html>
<head>
<title>Holy Grail Layout</title>
<link rel="stylesheet" href="../style/holy_grail.css">
</head>
<body>

<h1 style="text-align:center;">Holy Grail Layout Demo</h1>

<!-- 1. Float-Based -->
<section>
<h2>1. Float-Based Layout</h2>
<div class="float-container">
    <header class="float-header">Header</header>
    <aside class="float-left">Left Sidebar</aside>
    <main class="float-main">Main Content</main>
    <aside class="float-right">Right Sidebar</aside>
    <footer class="float-footer">Footer</footer>
</div>
</section>

<!-- 2. Flexbox-Based -->
<section>
<h2>2. Flexbox Layout</h2>
<div class="flex-container">
    <header class="flex-header">Header</header>
    <div class="flex-body">
        <aside class="flex-left">Left Sidebar</aside>
        <main class="flex-main">Main Content</main>
        <aside class="flex-right">Right Sidebar</aside>
    </div>
    <footer class="flex-footer">Footer</footer>
</div>
</section>

<!-- 3. CSS Grid-Based -->
<section>
<h2>3. CSS Grid Layout</h2>
<div class="grid-container">
    <header class="grid-header">Header</header>
    <aside class="grid-left">Left Sidebar</aside>
    <main class="grid-main">Main Content</main>
    <aside class="grid-right">Right Sidebar</aside>
    <footer class="grid-footer">Footer</footer>
</div>
</section>

</body>
</html>
