<!DOCTYPE html>
<html>
<head>
<title>Positioning Challenge</title>
<link rel="stylesheet" href="../style/position.css">
</head>

<body>

<!-- Fixed Header -->
<header class="header">
<h1>My Website</h1>
</header>

<!-- Layout -->
<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Sidebar</h3>
        <p>Sticky Item 1</p>
        <p>Sticky Item 2</p>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h2>Main Content</h2>
        <p>This is the main content area.</p>

        <!-- Button to show modal -->
        <button onclick="showModal()">Open Modal</button>
    </div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h2>Modal Dialog</h2>
        <p>This is an absolutely positioned modal.</p>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
function showModal(){
    document.getElementById("modal").style.display = "block";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
